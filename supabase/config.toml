# Configuración de Supabase CLI para Korrige.
project_id = "korrige"

[api]
schemas = ["public"]
max_rows = 1000

[auth]
site_url = "https://korrige.es"
additional_redirect_urls = ["https://korrige.es/app", "https://korrige.es/acceso", "http://localhost:5173/app", "http://localhost:5173/acceso"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true

# El formulario de ventas es público: la función valida, limita y usa service_role por dentro.
[functions.sales-lead]
verify_jwt = false

# La purga de retención comprueba ella misma el secreto (service role o CRON_SECRET).
[functions.retention-purge]
verify_jwt = false

# Invitaciones: exige sesión (JWT) y comprueba dentro que quien llama es administrador.
[functions.send-invite]
verify_jwt = true
