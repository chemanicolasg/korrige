# Despliegue en Netlify. Variables necesarias (Site settings → Environment):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# La landing (/) es HTML prerenderizado; el resto de rutas las sirve la SPA.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pdfjs-wasm/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
